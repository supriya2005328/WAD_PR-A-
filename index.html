<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam Admin Dashboard</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        
        <div class="col-lg-2 col-md-3 sidebar">
            <h4 class="text-white text-center mt-3">
                <i class="bi bi-mortarboard-fill"></i> Exam Admin
            </h4>

            <ul class="nav flex-column mt-4">

                <li class="nav-item">
                    <a class="nav-link active" href="#">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-people-fill"></i> Students
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-file-earmark-text"></i> Results
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-journal-bookmark-fill"></i> Exams
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-graph-up"></i> Reports
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-gear-fill"></i> Settings
                    </a>
                </li>

            </ul>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col-lg-10 col-md-9 p-4 main-content">

            <h2 class="mb-4">Exam Dashboard</h2>

            <!-- STAT CARDS -->
            <div class="row g-4">

                <div class="col-md-6 col-lg-3">
                    <div class="card stat-card">
                        <i class="bi bi-people stat-icon"></i>
                        <h5>Total Students</h5>
                        <h3>1200</h3>
                    </div>
                </div>

                <div class="col-md-6 col-lg-3">
                    <div class="card stat-card">
                        <i class="bi bi-check-circle stat-icon"></i>
                        <h5>Pass Students</h5>
                        <h3>950</h3>
                    </div>
                </div>

                <div class="col-md-6 col-lg-3">
                    <div class="card stat-card">
                        <i class="bi bi-x-circle stat-icon"></i>
                        <h5>Fail Students</h5>
                        <h3>180</h3>
                    </div>
                </div>

                <div class="col-md-6 col-lg-3">
                    <div class="card stat-card">
                        <i class="bi bi-person-dash stat-icon"></i>
                        <h5>Absent</h5>
                        <h3>70</h3>
                    </div>
                </div>

            </div>

             <div class="col-lg-10 col-md-9 p-4 main-content">

            <h2 class="mb-4">Exam Dashboard</h2>

            <!-- GRAPH SECTION -->
            <div class="row mt-4 g-4">

                <!-- BAR GRAPH -->
                <div class="col-lg-6">
                    <div class="card graph-card p-4">
                        <h5 class="mb-4">
                            <i class="bi bi-bar-chart-fill"></i> Exam Performance
                        </h5>

                        <div class="bar-graph">

                            <div class="bar-box">
                                <div class="percent">70%</div>
                                <div class="bar-fill" style="height:70%"></div>
                                <span>FY</span>
                            </div>

                            <div class="bar-box">
                                <div class="percent">80%</div>
                                <div class="bar-fill" style="height:85%"></div>
                                <span>SY</span>
                            </div>

                            <div class="bar-box">
                                <div class="percent">80%</div>
                                <div class="bar-fill" style="height:90%"></div>
                                <span>TY</span>
                            </div>

                            <div class="bar-box">
                                <div class="percent">80%</div>
                                <div class="bar-fill" style="height:95%"></div>
                                <span>Final</span>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- PIE CHART -->
                <div class="col-lg-6">
                    <div class="card graph-card p-4">
                        <h5 class="mb-4">
                            <i class="bi bi-pie-chart-fill"></i> Result Distribution
                        </h5>

                        <div class="pie-section">
                            <div class="pie-chart"></div>

                            <div class="pie-info">
                                <p><span class="pass"></span> Pass - 70%</p>
                                <p><span class="fail"></span> Fail - 20%</p>
                                <p><span class="absent"></span> Absent - 10%</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>
</div>

</body>
</html>
